                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hibernation:
                description: Hibernation tracks the saved deployment scale state
                properties:
                  isHibernating:
                    description: IsHibernating indicates if the resources are currently
                      scaled to 0
                    type: boolean
                  lastActiveAt:
                    description: LastActiveAt is the timestamp of the last active
                      request
                    type: string
                  savedReplicas:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: SavedReplicas maps Deployment names to their original
                      replica counts
                    type: object
                required:
                - isHibernating
                type: object
              phase:
                default: Pending
                description: Phase is the current lifecycle phase of the preview environment
                type: string
              previewUrl:
                description: PreviewURL is the external ingress URL for this environment
                type: string
              sreMetrics:
                description: SREMetrics shows the latest Prometheus evaluation snapshot
                properties:
                  currentErrorRatePercent:
                    description: CurrentErrorRatePercent is the calculated 5xx error
                      rate
                    type: number
                  currentP99LatencyMs:
                    description: CurrentP99LatencyMs is the P99 latency in milliseconds
                    type: number
                  currentPodRestarts:
                    description: CurrentPodRestarts is the container restart count
                    type: integer
                  lastEvaluatedAt:
                    description: LastEvaluatedAt is the timestamp of the last evaluation
                    type: string
                required:
                - currentErrorRatePercent
                - currentP99LatencyMs
                - currentPodRestarts
