---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: previewenvironments.preview.preview.io
spec:
  group: preview.preview.io
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    singular: previewenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.previewUrl
      name: URL
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment is the Schema for the previewenvironments
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewEnvironmentSpec defines the desired state of PreviewEnvironment
            properties:
              branch:
                description: Branch is the git branch name for the PR
                type: string
              commitSha:
                description: CommitSha is the git commit SHA to deploy
                type: string
              domain:
                description: Domain is the base domain for preview URLs (e.g. preview.company.com)
                type: string
              finops:
                description: FinOps defines the auto-hibernation configuration
                properties:
                  autoHibernate:
                    default: true
                    description: AutoHibernate enables scaling down to 0 replicas
                      if idle
                    type: boolean
                  idleDuration:
                    default: 2h
                    description: IdleDuration is the inactivity time before hibernation
                      (e.g., "2h")
                    type: string
                type: object
              gitops:
                description: GitOps is the GitOps configuration for the application
                properties:
                  helmValues:
                    additionalProperties:
                      type: string
                    description: HelmValues contains key-value pairs passed as custom
                      parameters to Helm
                    type: object
                  path:
                    description: Path is the directory path within the repo containing
                      manifests
                    type: string
                  targetRevision:
                    description: TargetRevision is the branch/tag/sha to sync (usually
                      same as Spec.Branch)
                    type: string
                required:
                - path
                - targetRevision
                type: object
